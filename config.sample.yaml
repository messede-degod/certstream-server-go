webserver:
  # For IPv6, set the listen_addr to "::"
  listen_addr: "0.0.0.0"
  listen_port: 8080
  # If you want to use a reverse proxy in front of the server, set this to true
  # It will use the X-Forwarded-For header to get the real IP of the client
  real_ip: false
  full_url: "/full-stream"
  lite_url: "/"
  domains_only_url: "/domains-only"
  cert_path: ""
  cert_key_path: ""
  # specify if the server should attempt to negotiate per message compression (RFC 7692)
  compression_enabled: false

prometheus:
  enabled: true
  listen_addr: "0.0.0.0"
  listen_port: 8080
  metrics_url: "/metrics"
  expose_system_metrics: false
  real_ip: false
  whitelist:
    - "127.0.0.1/8"

general:
  # DisableDefaultLogs indicates whether the default logs used in Google Chrome and provided by Google should be disabled.
  disable_default_logs: false
  # When you want to add logs that are not contained in the log list provided by
  # Google (https://www.gstatic.com/ct/log_list/v3/log_list.json), you can add them here.
  #additional_logs:
  #  - url: https://ct.googleapis.com/logs/us1/mirrors/digicert_nessie2022
  #    operator: "DigiCert"
  #    description: "DigiCert Nessie2022 log"

  #additional_tiled_logs:
  #  - url: https://ct.cloudflare.com/logs/raio2025h2b/
  #    operator: "Cloudflare"
  #    description: "Cloudflare 'Raio2025h2b'"

  # To optimize the performance of the server, you can overwrite the size of different buffers
  # For low CPU, low memory machines, you should reduce the buffer sizes to save memory in case the CPU is maxed.
  buffer_sizes:
    # Buffer for each websocket connection
    websocket: 300
    # Buffer for each CT log connection
    ctlog: 1000
    # Combined buffer for the broadcast manager
    broadcastmanager: 10000

  # Google regularly updates the log list. If this option is set to true, the server will remove all logs no longer listed in the Google log list.
  # This option defaults to true. See https://github.com/d-Rickyy-b/certstream-server-go/issues/51
  drop_old_logs: true

  # Options for resuming certificate downloads after restart
  recovery:
    # If enabled, the server will resume downloading certificates from the last processed and stored index for each log.
    # If there is no ct_index_file or for a specific log there is no index entry, the server will start from index 0.
    # Be aware that this leads to a massive number of certificates being downloaded.
    # Depending on your server's performance and network connection, this could be up to 10.000 certificates per second.
    # Make sure your infrastructure can handle this!
    enabled: true
    start_at_latest_sth: true
    # Path to the file where indices are stored. Be aware that a temp file in the same path with the same name and ".tmp" as suffix will be created.
    # If there are no write permissions to the path, the server will not be able to store the indices.
    ct_index_file: "./ct_index.json"

# Optional: persist observed certificates to disk with automatic log rotation.
disklogger:
  enabled: false
  # FULL = full JSON entry, LITE = JSON without chain/DER, DOMAINS_ONLY = one domain per line
  type: DOMAINS_ONLY
  log_directory: logs
  rotation: DAILY # HOURLY, DAILY

kafka:
  enabled: false
  brokers:
    - "localhost:9092"
  topic: "certstream"
  # FULL = full JSON entry, LITE = JSON without chain/DER, DOMAINS_ONLY = JSON domains array,
  # FERRET_DOMAIN = one protobuf DomainInput message per domain (ferret-injestor compatible;
  # set topic to "domains.input" and point brokers/auth/tls at that cluster)
  format: FERRET_DOMAIN
  # Message compression: none, gzip, snappy, lz4, zstd
  compression: snappy
  client_id: "certstream-server-go"
  # Batching: a batch is flushed when it reaches batch_max_records OR linger_ms elapses.
  linger_ms: 3000
  batch_max_records: 1500
  # Optional hard cap on the size (bytes) of a single produce batch. 0 = franz-go default.
  batch_max_bytes: 0
  # Buffer between the cert stream and the publisher. When full, sends block (no drop).
  channel_buffer: 10000
  auth:
    enabled: false
    # plain, scram-sha-256, scram-sha-512
    mechanism: plain
    username: ""
    password: ""
  tls:
    enabled: false
    insecure_skip_verify: false
    # Optional path to an additional CA certificate (PEM) to trust.
    ca_cert: ""

# Optional: embedded SQLite-backed domain deduplicator (pure-Go, WAL journaling).
# NOTE: this applies to the per-domain sinks - the Kafka FERRET_DOMAIN sink and the disk
# logger DOMAINS_ONLY sink. Domains already recorded within the retention window are
# dropped once (single shared DB) before those sinks emit them. All other Kafka/disk
# formats and the websocket sink are unaffected. When both sinks run they share the same
# deduplicated stream.
deduplicator:
  enabled: false
  # SQLite database file (WAL mode; "-wal"/"-shm" sidecar files are created next
  # to it). The WAL is checkpointed into the main file on shutdown, so there is
  # no flush interval to configure.
  db_path: "./dedup.sqlite"
  # Domains stay "seen" (and are suppressed) for this many days from first
  # insertion. A background job purges older entries once every 24h.
  retention_days: 30
  # In-memory LRU (number of domains) kept in front of the DB to cut read load.
  # Set to 0 to disable the cache.
  cache_size: 1000000
